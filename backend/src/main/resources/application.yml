spring:
  application:
    name: sigtau

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea database/schema.sql, no Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: 8080

sigtau:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 7
  cors:
    allowed-origins: "http://localhost:5173"
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@sigtau.local}


---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:sigtau;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

sigtau:
  jwt:
    secret: dev-only-sigtau-jwt-secret-change-before-production-2026
  jpa:
    hibernate:
      ddl-auto: create-drop   # en dev, Hibernate crea el esquema en memoria a partir de las entidades

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/sigtau
    username: ${DB_USER:sigtau_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
