# Configuración de la aplicación Spring Boot para el proyecto SIGTAU.

spring:
  application:
    name: sigtau

  jpa:
    hibernate:
      ddl-auto: validate # El esquema lo crea database/schema.sql, no Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 130MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: 8080

sigtau:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 7

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:no-reply@sigtau.local}

  storage:
    upload-dir: ${SIGTAU_UPLOAD_DIR:./uploads}

---
# Configuración para el perfil de desarrollo

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/BD_SIGTAU
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: PG1234

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate

sigtau:
  jwt:
    secret: dev-only-sigtau-jwt-secret-change-before-production-2026

---
# Configuración para el perfil de producción

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/sigtau
    username: ${DB_USER:sigtau_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
